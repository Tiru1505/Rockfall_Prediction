# Render blueprint — deploys the FastAPI backend plus a Postgres database.
#
# Use it via Render Dashboard -> New -> Blueprint, pointed at this repo.
# The frontend is NOT here; it deploys to Vercel (see vercel.json).
#
# Python is pinned to 3.11: numpy 1.26.4 and pandas 2.2.2 have no wheels for
# 3.13 (Render's current default), so an unpinned build tries to compile numpy
# from source and fails.

databases:
  - name: rockfall-db
    databaseName: rockfall
    plan: free
    # Render's free Postgres expires after 30 days — upgrade or recreate before
    # then, or the API loses its database.

services:
  - type: web
    name: rockfall-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; binding to a fixed port fails health checks.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        fromDatabase:
          name: rockfall-db
          property: connectionString

      # Generated once by Render and kept stable across deploys. Rotating it
      # invalidates every issued JWT, signing all users out.
      - key: ROCKFALL_SECRET_KEY
        generateValue: true

      - key: ROCKFALL_ENV
        value: production

      # Comma-separated allowlist of frontend origins. Set this to your Vercel
      # URL after the first frontend deploy, e.g.
      #   https://rockfall-system.vercel.app
      # Leaving it unset falls back to "*", which works but allows any origin.
      - key: ROCKFALL_CORS_ORIGINS
        sync: false

      - key: ROCKFALL_MONITORING_AUTOSTART
        value: "1"

      # On the free plan the service sleeps after ~15 minutes of inactivity, so
      # a very short interval buys nothing. 60s keeps the history readable
      # without spending the whole quota on ticks.
      - key: ROCKFALL_MONITORING_INTERVAL
        value: "60"
